<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Current e-commerce microservices architecture</title>
  <desc id="desc">Clients call an API Gateway which routes to six business services. Services use Eureka and Config Server, own separate data stores, and communicate through Kafka and gRPC.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:400 15px system-ui,sans-serif;fill:#475569}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.platform{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.service{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.data{fill:#ecfdf5;stroke:#059669;stroke-width:2}.messaging{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.contract{fill:#faf5ff;stroke:#9333ea;stroke-width:2}.label{font:600 16px system-ui,sans-serif;fill:#0f172a}.detail{font:400 13px system-ui,sans-serif;fill:#334155}.group-label{font:700 17px system-ui,sans-serif;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.edge-label{font:500 12px system-ui,sans-serif;fill:#475569}.warning{fill:#fff1f2;stroke:#e11d48;stroke-width:1.5}.warning-text{font:500 13px system-ui,sans-serif;fill:#9f1239}
    </style>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">Current E-commerce Microservices Architecture</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">Implemented repository structure before modernization</text>

  <rect x="555" y="90" width="290" height="64" rx="10" class="platform"/>
  <text x="700" y="117" text-anchor="middle" class="label">Client</text>
  <text x="700" y="138" text-anchor="middle" class="detail">JSON / HTTP</text>
  <path d="M700 154 V190" class="edge"/>

  <rect x="520" y="190" width="360" height="72" rx="10" class="platform"/>
  <text x="700" y="220" text-anchor="middle" class="label">API Gateway :9191</text>
  <text x="700" y="243" text-anchor="middle" class="detail">Path routing and Eureka load balancing</text>

  <rect x="55" y="305" width="1010" height="355" rx="16" class="group"/>
  <text x="78" y="335" class="group-label">Business services</text>

  <g>
    <rect x="85" y="365" width="280" height="92" rx="10" class="service"/>
    <text x="225" y="395" text-anchor="middle" class="label">User Service</text>
    <text x="225" y="418" text-anchor="middle" class="detail">OTP, JWT, users, addresses</text>
    <text x="225" y="439" text-anchor="middle" class="detail">MongoDB · Twilio · Kafka</text>

    <rect x="420" y="365" width="280" height="92" rx="10" class="service"/>
    <text x="560" y="395" text-anchor="middle" class="label">Product Service</text>
    <text x="560" y="418" text-anchor="middle" class="detail">Catalog and product data</text>
    <text x="560" y="439" text-anchor="middle" class="detail">MySQL · Kafka producer · gRPC</text>

    <rect x="755" y="365" width="280" height="92" rx="10" class="service"/>
    <text x="895" y="395" text-anchor="middle" class="label">Category Service</text>
    <text x="895" y="418" text-anchor="middle" class="detail">Category hierarchy</text>
    <text x="895" y="439" text-anchor="middle" class="detail">MySQL · gRPC client</text>

    <rect x="85" y="515" width="280" height="92" rx="10" class="service"/>
    <text x="225" y="545" text-anchor="middle" class="label">Cart Service</text>
    <text x="225" y="568" text-anchor="middle" class="detail">Cart and partial checkout state</text>
    <text x="225" y="589" text-anchor="middle" class="detail">MongoDB · Kafka · gRPC client</text>

    <rect x="420" y="515" width="280" height="92" rx="10" class="service"/>
    <text x="560" y="545" text-anchor="middle" class="label">Order Service</text>
    <text x="560" y="568" text-anchor="middle" class="detail">Basic orders and partial payment</text>
    <text x="560" y="589" text-anchor="middle" class="detail">MySQL · Razorpay</text>

    <rect x="755" y="515" width="280" height="92" rx="10" class="service"/>
    <text x="895" y="545" text-anchor="middle" class="label">Filter Service</text>
    <text x="895" y="568" text-anchor="middle" class="detail">Derived product search projection</text>
    <text x="895" y="589" text-anchor="middle" class="detail">Elasticsearch · Kafka consumer</text>
  </g>

  <path d="M620 262 V305" class="edge"/>
  <text x="635" y="288" class="edge-label">routes</text>

  <rect x="1105" y="305" width="240" height="355" rx="16" class="group"/>
  <text x="1128" y="335" class="group-label">Platform</text>
  <rect x="1130" y="365" width="190" height="74" rx="10" class="platform"/>
  <text x="1225" y="395" text-anchor="middle" class="label">Eureka Registry</text>
  <text x="1225" y="417" text-anchor="middle" class="detail">Discovery</text>
  <rect x="1130" y="475" width="190" height="84" rx="10" class="platform"/>
  <text x="1225" y="505" text-anchor="middle" class="label">Config Server</text>
  <text x="1225" y="527" text-anchor="middle" class="detail">Git-backed configuration</text>
  <rect x="1130" y="595" width="190" height="44" rx="10" class="contract"/>
  <text x="1225" y="623" text-anchor="middle" class="label">Proto Contracts</text>

  <path d="M1065 402 H1130" class="edge dash"/>
  <path d="M880 226 H1225 V365" class="edge dash"/>
  <text x="1080" y="390" class="edge-label">registration</text>
  <path d="M1065 520 H1130" class="edge dash"/>
  <text x="1072" y="510" class="edge-label">configuration</text>

  <rect x="55" y="705" width="1290" height="145" rx="16" class="group"/>
  <text x="78" y="735" class="group-label">Data and messaging</text>
  <rect x="85" y="765" width="190" height="58" rx="10" class="data"/>
  <text x="180" y="800" text-anchor="middle" class="label">MySQL schemas</text>
  <rect x="315" y="765" width="190" height="58" rx="10" class="data"/>
  <text x="410" y="800" text-anchor="middle" class="label">MongoDB databases</text>
  <rect x="545" y="765" width="190" height="58" rx="10" class="messaging"/>
  <text x="640" y="800" text-anchor="middle" class="label">Kafka</text>
  <rect x="775" y="765" width="190" height="58" rx="10" class="data"/>
  <text x="870" y="800" text-anchor="middle" class="label">Elasticsearch</text>
  <rect x="1005" y="765" width="140" height="58" rx="10" class="contract"/>
  <text x="1075" y="800" text-anchor="middle" class="label">gRPC</text>
  <rect x="1185" y="765" width="130" height="58" rx="10" class="platform"/>
  <text x="1250" y="790" text-anchor="middle" class="label">Providers</text>
  <text x="1250" y="811" text-anchor="middle" class="detail">Twilio · Razorpay</text>

  <path d="M560 457 V480 H1075 V765" class="edge"/>
  <path d="M895 457 V480 H1075" class="edge"/>
  <path d="M225 515 V485 H1075" class="edge"/>
  <text x="1018" y="472" class="edge-label">product queries</text>
  <path d="M560 457 V490 H640 V765" class="edge"/>
  <path d="M640 765 V680 H895 V607" class="edge"/>
  <text x="655" y="695" class="edge-label">product-created event</text>
  <path d="M895 607 V680 H870 V765" class="edge"/>

  <rect x="240" y="888" width="920" height="54" rx="10" class="warning"/>
  <text x="700" y="912" text-anchor="middle" class="warning-text">Current gaps: incomplete security, checkout/payment lifecycle, reliable events, local reproducibility, and test coverage</text>
  <text x="700" y="932" text-anchor="middle" class="warning-text">This diagram describes the repository today; it is not a production-readiness claim.</text>
</svg>
